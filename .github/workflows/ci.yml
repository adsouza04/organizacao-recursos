name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # O runner do GitHub já tem Docker: o Testcontainers sobe o PostgreSQL sozinho.
      # verify = testes unitários + integração (*IT) + gate do JaCoCo (80% linhas / 70% branches)
      - name: Build e verificação
        run: mvn -B -ntp verify

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore
